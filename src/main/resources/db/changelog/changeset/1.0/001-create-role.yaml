databaseChangeLog:
  - changeSet:
      id: 001-create-roles
      author: artsobol

      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_roles
              - column:
                  name: name
                  type: varchar(16)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_roles_name

  - changeSet:
      id: 002-insert-roles
      author: artsobol

      changes:
        - sql:
            sql: |
              INSERT INTO roles (name)
              VALUES ('USER')
              ON CONFLICT (name) DO NOTHING;