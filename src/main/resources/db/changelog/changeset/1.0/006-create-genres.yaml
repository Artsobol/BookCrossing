databaseChangeLog:
  - changeSet:
      id: 006-create-genres
      author: artsobol

      changes:
        - createTable:
            tableName: genres
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_genres
              - column:
                  name:  title
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name:  description
                  type: text
              - column:
                  name: slug
                  type: varchar(128)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_genres_slug
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  defaultValueComputed: "0"
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: uuid
              - column:
                  name: updated_by
                  type: uuid

        - addForeignKeyConstraint:
            baseTableName: genres
            baseColumnNames: created_by
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_genres_created_by

        - addForeignKeyConstraint:
            baseTableName: genres
            baseColumnNames: updated_by
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_genres_updated_by