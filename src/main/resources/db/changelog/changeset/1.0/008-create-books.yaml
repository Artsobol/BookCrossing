databaseChangeLog:
  - changeSet:
      id: 008-create-books
      author: artsobol

      changes:
        - createTable:
            tableName: books
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_books
              - column:
                  name: title
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: bigint
              - column:
                  name: genre_id
                  type: bigint
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: books
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_books_user_id

        - addForeignKeyConstraint:
            baseTableName: books
            baseColumnNames: author_id
            referencedTableName: authors
            referencedColumnNames: id
            constraintName: fk_books_author_id

        - addForeignKeyConstraint:
            baseTableName: books
            baseColumnNames: genre_id
            referencedTableName: genres
            referencedColumnNames: id
            constraintName: fk_books_genre_id